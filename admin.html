<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Fotografer — Rizal Khaerul Anam</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>
body{min-height:100vh}.admin-wrap{max-width:1100px;margin:auto;padding:90px 20px 60px}.admin-grid{display:grid;grid-template-columns:1fr 2fr;gap:18px}.panel{border:1px solid var(--line,rgba(255,255,255,.12));background:var(--surface,rgba(255,255,255,.04));border-radius:20px;padding:24px}.stack{display:grid;gap:12px}.stack input{padding:13px;border-radius:12px;border:1px solid var(--line,rgba(255,255,255,.12));background:transparent;color:inherit}.request{border:1px solid var(--line,rgba(255,255,255,.12));border-radius:16px;padding:18px;margin-bottom:12px}.request-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{opacity:.7}.status{padding:12px;border-radius:12px;margin-top:12px}.ok{background:rgba(60,180,110,.12)}.err{background:rgba(220,70,70,.12)}.wait{background:rgba(220,170,50,.12)}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="admin-wrap">
  <a href="index.html" class="btn btn-secondary">← Portfolio</a>
  <div style="margin:25px 0"><span class="muted">ADMIN · PROJECT FOTOGRAFER</span><h1>Verifikasi Akses</h1><p class="muted">Terima atau tolak permintaan. Hanya admin yang boleh mengubah role pengguna.</p></div>

  <div id="loginPanel" class="panel" style="max-width:520px">
    <h2>Login Admin</h2>
    <form id="adminLogin" class="stack">
      <input id="adminEmail" type="email" placeholder="Email admin" required>
      <input id="adminPassword" type="password" placeholder="Password" required>
      <button class="btn btn-primary">Masuk</button>
    </form>
    <div id="loginStatus"></div>
  </div>

  <div id="dashboard" style="display:none">
    <div class="admin-grid">
      <aside class="panel">
        <span class="muted">STATUS</span>
        <h2 id="count">0 permintaan</h2>
        <p class="muted">Role: FEMALE, MALE, atau PUBLIC. Role yang disetujui tersimpan pada akun.</p>
        <button id="logout" class="btn btn-secondary">Keluar</button>
      </aside>
      <section class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <h2>Permintaan masuk</h2><button id="refresh" class="btn btn-secondary">Refresh</button>
        </div>
        <div id="requests"></div>
      </section>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin.js"></script>
</body>
</html>
