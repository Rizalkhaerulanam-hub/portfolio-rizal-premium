<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desain Canva — Rizal Khaerul Anam</title>
    <!-- Menghubungkan ke file CSS yang sama agar desainnya konsisten -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Latar belakang noise dan efek glow (sama seperti beranda) -->
    <div class="cursor-glow" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>

    <main>
      <section class="section projects">
        <div class="container">
          <!-- Tombol kembali ke halaman utama -->
          <a
            href="index.html"
            class="btn btn-ghost"
            style="margin-bottom: 40px"
          >
            ← Kembali ke Beranda
          </a>

          <div class="section-heading">
            <p class="eyebrow"><span></span> KUMPULAN KARYA</p>
            <h2>Desain <em>Canva.</em></h2>
            <p class="heading-note">
              Berikut adalah beberapa hasil desain grafis, poster, dan
              infografis yang saya buat menggunakan Canva.
            </p>
          </div>

          <!-- Tempat Anda menaruh gambar-gambar desain nantinya -->
          <div class="project-grid">
            <!-- Contoh 1 Kotak Gambar -->
            <article class="project-card">
              <div class="project-image">
                <!-- Ganti src dengan nama gambar desain Canva Anda -->
                <img
                  src="assets/Project/contoh-desain-1.png"
                  alt="Desain Poster 1"
                />
              </div>
            </article>

            <!-- Contoh 2 Kotak Gambar -->
            <article class="project-card">
              <div class="project-image">
                <img
                  src="assets/Project/contoh-desain-2.png"
                  alt="Desain Poster 2"
                />
              </div>
            </article>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
